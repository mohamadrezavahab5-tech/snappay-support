<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>SnappPay Answer Hub</title>
<style>
:root{

 --shadow:0 10px 30px rgba(20,26,40,.07);--shadow-lg:0 24px 70px rgba(20,26,40,.12);

}
[data-theme="dark"]{

 --text:#eef2f7;--muted:#9aa6b5;--muted2:#6f7b8a;--line:#252e3a;--line2:#303a48;
 --accent:#8191ff;--accent2:#6c7cf6;--accent-soft:#1a2243;
 --success:#5ed7ad;--success-soft:#12271f;--warn:#e5c06d;--warn-soft:#251f12;--danger:#ff8297;--danger-soft:#2d171e;
 --shadow:0 12px 34px rgba(0,0,0,.25);--shadow-lg:0 24px 70px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:rgba(75,103,242,.17)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd5de;border:3px solid transparent;background-clip:padding-box;border-radius:999px}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3a4656;border:3px solid transparent;background-clip:padding-box}

.hidden{display:none!important}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn{height:38px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--text);padding:0 13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.btn:hover{background:var(--surface3);border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.small{height:32px;padding:0 9px;font-size:11px}
.iconBtn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);display:grid;place-items:center}
.iconBtn:hover{color:var(--text);background:var(--surface3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800}
.tag{display:inline-flex;align-items:center;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--muted);font-size:9px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
.dot.live{background:var(--success);box-shadow:0 0 0 3px rgba(22,135,95,.10)}
.dot.warn{background:#e1a521}.dot.bad{background:var(--danger)}
.muted{color:var(--muted)}
.sep{height:1px;background:var(--line);margin:12px 0}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:34px;text-align:center;color:var(--muted);background:var(--surface2)}

.auth{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--bg)}
.authCard{width:min(1020px,100%);min-height:620px;display:grid;grid-template-columns:42% 58%;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg)}
.authBrand{padding:46px;background:#151822;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.authBrand:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;border:56px solid rgba(255,255,255,.025);left:-140px;bottom:-120px}
.authLogo{width:46px;height:46px;border-radius:13px;background:#fff;color:#151822;display:grid;place-items:center;font-weight:900;font-size:18px}
.authBrand h1{font-size:38px;line-height:1.28;letter-spacing:-1.3px;margin:34px 0 10px;max-width:370px}
.authBrand p{font-size:12px;color:#adb5c2;max-width:340px;margin:0}
.authPerks{display:grid;gap:12px;margin-top:30px}
.authPerk{display:flex;gap:10px;align-items:center;color:#d8dde5;font-size:10px}
.authPerk i{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-style:normal}
.authFoot{font-size:9px;color:#727c8a}
.authPanel{padding:38px 44px;display:flex;flex-direction:column}
.authTabs{display:flex;gap:4px;background:var(--surface3);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:28px}
.authTabs button{height:34px;flex:1;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;font-weight:700}
.authTabs button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(20,26,40,.08)}
.authTitle{font-size:22px;margin:0 0 5px;letter-spacing:-.4px}.authSub{font-size:10px;color:var(--muted);margin-bottom:20px}
.form{display:grid;gap:11px}.two{grid-template-columns:1fr 1fr}
.field label{display:block;font-size:9px;color:var(--muted);font-weight:800;margin:0 2px 5px}
.field input,.field select{width:100%;height:42px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--text);padding:0 11px;outline:none;font-size:11px}
.field input:focus,.field select:focus{border-color:#a5b1ff;box-shadow:0 0 0 3px rgba(75,103,242,.08)}
.authMsg{font-size:10px;border-radius:9px;padding:9px 10px;margin-top:9px}
.authMsg.err{background:var(--danger-soft);color:var(--danger)}

.roleGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:260px;overflow:auto;padding:1px}
.roleCard{border:1px solid var(--line);border-radius:11px;background:var(--surface2);padding:11px;cursor:pointer;transition:.15s}
.roleCard:hover{border-color:#bac3ff}.roleCard.active{background:var(--accent-soft);border-color:#aab5ff}
.roleCard b{display:block;font-size:11px}.roleCard span{font-size:9px;color:var(--muted)}
.qList{display:grid;gap:9px;max-height:300px;overflow:auto}.qCard{border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--surface2)}
.qCard b{display:block;font-size:10px;margin-bottom:7px}.options{display:flex;gap:6px;flex-wrap:wrap}.option{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:9px;color:var(--muted)}
.option.active{background:var(--accent-soft);border-color:#b6c0ff;color:var(--accent)}
.authActions{display:flex;gap:8px;justify-content:flex-end;margin-top:auto;padding-top:18px}

.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;background:var(--surface);border-left:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;z-index:30}

.brand b{font-size:12px;display:block}.brand span{font-size:9px;color:var(--muted);display:block}
.nav{display:grid;gap:3px;margin-top:5px}

.userMini b{font-size:10px;display:block}.userMini span{font-size:9px;color:var(--muted);display:block}
.main{min-width:0}
.topbar{height:64px;position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:9px;padding:9px 22px;background:rgba(247,248,250,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.breadcrumb{font-size:10px;color:var(--muted);white-space:nowrap}
.searchWrap{position:relative;flex:1;max-width:850px;margin-right:8px}
.searchWrap input{width:100%;height:42px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--text);outline:none;padding:0 42px 0 72px;font-size:11px}

.searchWrap:before{content:"⌕";position:absolute;right:14px;top:4px;font-size:25px;color:var(--muted2)}
.kbd{position:absolute;left:9px;top:9px;border:1px solid var(--line);background:var(--surface3);color:var(--muted);border-radius:7px;font-size:8px;padding:2px 6px}
.searchPanel{display:none;position:absolute;top:48px;right:0;left:0;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);padding:6px;max-height:62vh;overflow:auto;z-index:80}
.searchPanel.open{display:block}
.searchItem{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 11px;border-radius:9px;cursor:pointer}
.searchItem:hover{background:var(--surface3)}
.searchItem b{display:block;font-size:11px}.searchItem span{font-size:9px;color:var(--muted)}.score{font-size:9px;color:var(--success);align-self:center}

.page{display:none;max-width:1240px;margin:auto;padding:30px 32px 70px}
.page.active{display:block;animation:fade .18s ease}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:28px 30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;border:44px solid var(--accent-soft);opacity:.45;left:-115px;top:-120px}
.heroEyebrow{font-size:9px;letter-spacing:.7px;color:var(--accent);font-weight:900}
.hero h1{font-size:34px;line-height:1.4;letter-spacing:-.8px;margin:6px 0 8px;max-width:780px}

.heroSearch{position:relative;max-width:900px;margin-top:20px}
.heroSearch input{width:100%;height:56px;border:1px solid var(--line2);border-radius:14px;background:var(--surface2);color:var(--text);outline:none;padding:0 48px 0 14px;font-size:13px}
.heroSearch:before{content:"⌕";position:absolute;right:15px;top:5px;font-size:30px;color:var(--muted2)}
.exampleRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.example{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:8px;padding:5px 8px;font-size:9px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.metric{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:12px 14px}
.metric b{font-size:19px;display:block;line-height:1.2}.metric span{font-size:9px;color:var(--muted)}
.section{margin-top:25px}.sectionHead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
.sectionHead h2{font-size:15px;margin:0}.sectionHead p{font-size:9px;color:var(--muted);margin:1px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;transition:.15s}
.card.click{cursor:pointer}.card.click:hover{border-color:#cfd4df;transform:translateY(-1px);box-shadow:0 7px 18px rgba(20,26,40,.04)}
.cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card h3{font-size:12px;line-height:1.65;margin:8px 0 4px}.card p{font-size:9px;color:var(--muted);margin:0}
.count{font-size:9px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;color:var(--muted);font-size:9px}
.filter.active{background:var(--accent-soft);color:var(--accent);border-color:#c5cdff}

.articleLayout{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:16px;align-items:start}
.articleMain{min-width:0}.articleAside{position:sticky;top:82px;display:grid;gap:9px}
.articleHead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.backBtn{border:0;background:transparent;color:var(--muted);padding:0;font-size:10px;font-weight:750}
.backBtn:hover{color:var(--text)}
.articleTitle{font-size:26px;line-height:1.45;letter-spacing:-.5px;margin:14px 0 7px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.sample{font-size:10px;color:var(--muted);margin-top:8px}
.cover{width:100%;max-height:430px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:8px}
.response{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.responseBar{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:space-between}
.responseBar b{font-size:11px}.responseBar span{display:block;font-size:8px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.answer{padding:20px 22px;line-height:2.05;font-size:12px;white-space:pre-wrap}
.inlineUrl{display:inline-block;direction:ltr;unicode-bidi:isolate;color:var(--accent);font-weight:700;text-decoration:none;background:var(--accent-soft);border:1px solid #dfe4ff;border-radius:6px;padding:1px 5px;margin:1px 3px}
.internal{margin-top:10px;border:1px solid #f0dfb5;background:var(--warn-soft);color:var(--warn);border-radius:13px;padding:12px 14px;font-size:9px}
.asideBox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}
.asideLabel{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.5px;margin-bottom:8px}
.actionBox{background:var(--accent-soft);border:1px solid #dfe4ff;border-radius:11px;padding:11px}
.actionBox b{display:block;font-size:11px;margin-bottom:8px}.actionBox code{direction:ltr;unicode-bidi:isolate;display:block;background:var(--surface);border:1px solid var(--line);padding:6px 7px;border-radius:7px;font-size:8px;color:var(--muted);overflow-wrap:anywhere;margin-top:7px}
.actionLink{height:36px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.sourceLink{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-size:9px}
.related{display:grid;gap:6px}.related button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 8px;text-align:right;font-size:9px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.shot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}.shot img{width:100%;height:220px;object-fit:contain;background:#fff;border-radius:8px}.shot span{font-size:8px;color:var(--muted)}

.trainingHero{display:grid;grid-template-columns:1fr 250px;gap:10px}.progressCard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;display:grid;place-items:center}.progressRing{--p:0%;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),var(--surface3) 0);display:grid;place-items:center;position:relative}.progressRing:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}.progressRing b{z-index:2;font-size:21px}
.modules{display:grid;gap:8px;margin-top:16px}.module{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:start}.moduleNum{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900}.module h3{font-size:11px;margin:0}.module p{font-size:9px;color:var(--muted);margin:2px 0 0}.moduleDetail{display:none;grid-column:2/4;padding-top:9px;border-top:1px dashed var(--line)}.module.open .moduleDetail{display:block}.exercise{background:#f8f6ff;border:1px solid #ece7ff;border-radius:9px;padding:9px;font-size:9px;margin-top:7px}[data-theme="dark"] .exercise{background:#1c1930;border-color:#30284e}

.adminTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.adminStats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.adminStat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.adminStat b{font-size:18px;display:block}.adminStat span{font-size:8px;color:var(--muted)}
.tableWrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:9px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:var(--surface2);color:var(--muted);font-size:8px}.roleSelect{height:31px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:9px}
.pending{color:var(--warn);background:var(--warn-soft)}.activeStatus{color:var(--success);background:var(--success-soft)}.disabledStatus{color:var(--danger);background:var(--danger-soft)}
.sbadge{padding:3px 6px;border-radius:7px;font-size:8px;font-weight:800}

.pendingView{max-width:680px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;box-shadow:var(--shadow)}
.pendingIcon{width:62px;height:62px;border-radius:18px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;margin:auto;font-size:26px}.pendingView h2{font-size:20px;margin:17px 0 6px}.pendingView p{font-size:10px;color:var(--muted)}

.command{display:none;position:fixed;inset:0;background:rgba(11,15,22,.48);backdrop-filter:blur(6px);z-index:120}.command.open{display:grid;place-items:start center}.commandBox{width:min(700px,calc(100% - 28px));margin-top:10vh;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:8px}.commandBox input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);outline:none;background:transparent;color:var(--text);padding:0 11px;font-size:13px}.cmdResults{max-height:60vh;overflow:auto;padding-top:5px}
.toast{position:fixed;left:18px;bottom:18px;z-index:200;background:#151822;color:#fff;border-radius:10px;padding:9px 12px;font-size:9px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}

@media(max-width:1080px){:root{--sidebar:74px}.brand>div:last-child,.nav button span:last-child,.sideFoot .userMini>div:nth-child(2){display:none}.nav button{justify-content:center}.userMini{grid-template-columns:34px auto}.grid{grid-template-columns:repeat(2,1fr)}.articleLayout{grid-template-columns:1fr}.articleAside{position:static;grid-template-columns:repeat(2,1fr)}.trainingHero{grid-template-columns:1fr}}

@media(max-width:480px){.grid,.metrics,.adminStats{grid-template-columns:1fr}.two{grid-template-columns:1fr}.roleGrid{grid-template-columns:1fr}}
</style>

<style id="answerhub-v9-polish">
:root{
  --bg:#f6f8fc;--surface:#ffffff;--surface2:#fbfcff;--surface3:#f1f4f9;
  --text:#121722;--muted:#697386;--muted2:#9aa4b2;--line:#e7ebf1;--line2:#dce2ea;
  --accent:#425ee9;--accent2:#324ad0;--accent-soft:#eef2ff;
  --shadow:0 10px 30px rgba(29,39,67,.06);--shadow-lg:0 24px 70px rgba(29,39,67,.12)
}
body{background:
  radial-gradient(circle at 12% 0%,rgba(66,94,233,.055),transparent 27%),
  var(--bg)}
.authCard,.hero,.articleHead,.response,.asideBox,.card,.metric,.progressCard,.module,.tableWrap{
  box-shadow:0 1px 2px rgba(16,24,40,.018)
}
.authBrand{background:#111827}
.brandMark{background:#111827}
.hero:after{opacity:.28}
.answer{font-size:13px;line-height:2.08}
.response{box-shadow:0 8px 22px rgba(20,30,60,.035)}
.actionBox{background:#f3f5ff}
.inlineUrl{background:#f2f4ff}
.nav button.active{box-shadow:inset -3px 0 0 var(--accent)}
.releaseBanner{
  position:fixed;right:50%;transform:translateX(50%);bottom:18px;z-index:180;
  display:none;align-items:center;gap:10px;padding:9px 12px;border:1px solid #d9defd;
  background:#fff;color:#243050;border-radius:11px;box-shadow:var(--shadow);font-size:10px

.releaseBanner.show{display:flex}
.releaseBanner b{color:var(--accent)}
[data-theme="dark"] .releaseBanner{background:#171d27;color:#e8edf6;border-color:#2c3863}
.connectionCard{
  max-width:560px;margin:70px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px;text-align:center;box-shadow:var(--shadow)
}
.connectionCard h2{font-size:18px;margin:10px 0 5px}.connectionCard p{font-size:10px;color:var(--muted)}

<style id="quiz-ui">
.quizOverlay{position:fixed;inset:0;z-index:9999;background:rgba(10,15,28,.58);backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px}
.quizDialog{width:min(780px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px}
.quizHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.quizHead h2{margin:0;font-size:19px}.quizHead p{margin:3px 0 0;color:var(--muted);font-size:10px}
.quizQ{border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;background:var(--surface2)}
.quizQ>strong{display:block;margin-bottom:10px;font-size:12px}
.quizOptions{display:grid;gap:7px}.quizOption{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}

.quizResult{margin-top:13px;padding:13px;border-radius:12px;background:var(--surface3);font-size:11px}
.quizResult.pass{background:var(--success-soft);color:var(--success)}.quizResult.fail{background:var(--danger-soft);color:var(--danger)}
.examCard{margin:14px 0 18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--surface),var(--accent-soft))}
.examCard h3{margin:0 0 4px;font-size:15px}.examCard p{margin:0;color:var(--muted);font-size:10px}
.quizBadge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800;background:var(--success-soft);color:var(--success)}
</style>
</head>

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[ۀة]/g,"ه").replace(/\u200c/g," ").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()}
const syn=[
 ["شبا","iban","شماره حساب","بانک"],["تسویه","واریز","پول","پرداخت"],
 ["سرچ","جستجو","اپ","نمایش"],["forbidden","فوربیدن","403","ip","آی پی"],
 ["callback","کالبک","آدرس بازگشت"],["ثبت نام","ثبت‌نام","onboarding"],
 ["فعال سازی","فعال‌سازی","activating","لایو"],["کنسل","لغو","cancel"],
 ["تیکت","درخواست پشتیبانی","support"],["مودیان","مالیات","فاکتور","صورتحساب"],
 ["cms","ووکامرس","وردپرس","تکنولوژی"]
].map(g=>g.map(norm));
function expand(q){let t=new Set(norm(q).split(" ").filter(Boolean));syn.forEach(g=>{if(g.some(x=>[...t].some(y=>x.includes(y)||y.includes(x))))g.forEach(x=>x.split(" ").forEach(y=>t.add(y)))});return[...t]}
function trigrams(s){s="  "+norm(s)+"  ";let a=new Set;for(let i=0;i<s.length-2;i++)a.add(s.slice(i,i+3));return a}
function jac(a,b){if(!a.size||!b.size)return 0;let i=0;a.forEach(x=>{if(b.has(x))i++});return i/(a.size+b.size-i)}
function score(a,q){
  const nq=norm(q);if(!nq)return 0;
  const title=norm(a["عنوان مقاله"]),kw=norm(a["کلمات کلیدی"]),al=norm(a["عبارت‌های مشابه / Semantic Aliases"]),
        ex=norm(a["نمونه سؤال‌ها"]),tags=norm(a["تگ‌ها"]),cat=norm(a["دسته‌بندی"]);
  let s=0;
  if(title.includes(nq))s+=50;if(al.includes(nq))s+=40;if(kw.includes(nq))s+=30;if(ex.includes(nq))s+=24;
  expand(q).forEach(t=>{if(title.includes(t))s+=10;if(al.includes(t))s+=11;if(kw.includes(t))s+=8;if(ex.includes(t))s+=6;if(tags.includes(t))s+=4});
  s+=jac(trigrams(nq),trigrams([title,al,kw,ex,tags,cat].join(" ")))*34;
  return s*(.75+(parseFloat(a["وزن جستجو"]||70)/280))
}

}
function search(q,n=12){return allowedArticles().map(a=>({a,s:score(a,q)})).filter(x=>x.s>5).sort((x,y)=>y.s-x.s).slice(0,n)}

async function api(path,{method="GET",body=null,auth=true,prefer="",headers={}}={}){
  const h={apikey:SUPABASE_KEY,"Content-Type":"application/json",...headers};
  if(auth&&S.session?.access_token)h.Authorization="Bearer "+S.session.access_token;
  if(prefer)h.Prefer=prefer;
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);
  try{
    const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body?JSON.stringify(body):undefined,signal:ctrl.signal,cache:"no-store"});
    const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
    if(!r.ok){const err=new Error(data?.message||data?.error_description||data?.error||data?.hint||text||("HTTP "+r.status));err.status=r.status;err.data=data;throw err}
    return data
  }finally{clearTimeout(timer)}
}
function saveSession(x){
  S.session=x||null;
  if(x){
    x.expires_at=x.expires_at||Math.floor(Date.now()/1000)+(x.expires_in||3600);
    localStorage.setItem("ah-session",JSON.stringify(x))

  if(!S.session?.refresh_token)return false;

}
async function rpc(name,body={}){
  try{return await api("/rest/v1/rpc/"+name,{method:"POST",body})}
  catch(e){if(e.status===401&&await refreshSession())return api("/rest/v1/rpc/"+name,{method:"POST",body});throw e}

async function syncContent(silent=false){
  if(!S.session?.access_token||S.me?.status!=="active")return false;
  if(S.syncing)return S.syncing;
  S.syncing=(async()=>{
    try{
      const d=await api("/functions/v1/answerhub-data");
      if(!d?.ok)throw new Error(d?.error||"content_error");
      S.me={...(S.me||{}),...(d.profile||{}),email:d.email||S.me?.email};
      S.access=d.access||S.access;
      S.db={articles:d.articles||[],media:d.media||[],newJoiner:d.newJoiner||[],quizQuestions:d.quizQuestions||[],config:d.config||{},meta:d.meta||{version:BUILD}};
      S.sheetAt=new Date(d.meta?.synced_at||Date.now());
      if(document.querySelector(".shell")){
        const current=document.querySelector(".page.active")?.id?.replace("page-","")||"home";
        const q=$("#topSearch")?.value||"";
        renderApp();
        if(current!=="article")nav(current);
        if($("#topSearch"))$("#topSearch").value=q
      }
      if(!silent)toast("آخرین تغییرات دریافت شد ✓");
      return true
    }catch(e){
      if(e.status===403||e.message==="pending"){
        try{
          const a=await rpc("get_my_access");
          S.me=a.profile||S.me;S.access=a.access||null;
          if(S.me?.status!=="active"){clearSensitive();renderPending();return false}
        }catch{}
      }
      if(!silent)toast("دریافت نسخه جدید ناموفق بود");
      throw e
    }finally{S.syncing=null}
  })();
  return S.syncing
}

}

async function signupUser(state,qs,answers){
  clearSensitive();
  try{
    $("#finishSignup").disabled=true;
    const d=await api("/auth/v1/signup?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",auth:false,body:{email:state.email,password:state.password,data:{full_name:state.full_name,username:state.username,requested_role:state.requested_role}}});
    localStorage.setItem("ah-pending-onboarding",JSON.stringify({email:state.email.toLowerCase(),role:state.requested_role,qs,answers}));
    if(d.session||d.access_token){saveSession(d.session||d);await submitPendingOnboarding();await bootAuthed()}
    else showAuthMsg("حساب ساخته شد. ایمیل تأیید را باز کن؛ بعد از ورود، درخواستت برای تأیید ادمین نمایش داده می‌شود.",true)
  }catch(e){showAuthMsg(e.message||"ثبت‌نام انجام نشد")}
  finally{if($("#finishSignup"))$("#finishSignup").disabled=false}
}
async function loginUser(){
  clearSensitive();
  try{
    $("#loginBtn").disabled=true;
    const d=await api("/auth/v1/token?grant_type=password",{method:"POST",auth:false,body:{email:$("#loginEmail").value.trim(),password:$("#loginPass").value}});
    saveSession(d);await submitPendingOnboarding();await bootAuthed()
  }catch(e){
    showAuthMsg(String(e.message||"").includes("Email not confirmed")?"اول ایمیل تأیید حسابت را باز کن.":"ایمیل یا رمز عبور درست نیست.")
  }finally{if($("#loginBtn"))$("#loginBtn").disabled=false}
}
async function submitPendingOnboarding(){
  const raw=localStorage.getItem("ah-pending-onboarding");
  if(!raw||!S.session?.user?.id)return;
  try{
    const p=JSON.parse(raw);
    if(p.email!==String(S.session.user.email||"").toLowerCase())return;
    let total=0,correct=0;
    for(const q of p.qs||[]){
      const a=p.answers?.[q["Question ID"]]||"",key=q["Answer Key"]||"",passed=key?norm(a)===norm(key):null;
      if(key){total++;if(passed)correct++}
      await api("/rest/v1/onboarding_answers?on_conflict=user_id,question_id",{method:"POST",body:{
        user_id:S.session.user.id,requested_role:p.role,question_id:q["Question ID"],question:q["Question FA"],answer:a,score:passed===true?100:0,passed
      },prefer:"resolution=merge-duplicates,return=minimal"})
    }
    const sc=total?Math.round(correct/total*100):100;
    try{await rpc("mark_onboarding_complete",{p_score:sc})}catch{}
    localStorage.removeItem("ah-pending-onboarding")
  }catch{}
}

async function boot(){

async function bootAuthed(){
  try{
    const d=await rpc("get_my_access");
    if(!d?.ok||!d.profile){saveSession(null);return renderAuth()}
    S.me={...d.profile,email:d.email};S.access=d.access||null;
    if(S.me.status!=="active"){await submitPendingOnboarding();return renderPending()}
    const ok=await syncContent(true);
    if(!ok)return;
    await loadTrainingProgress();

    renderConnectionError()
  }

async function submitQuiz(scope,moduleId,qs,overlay){
  const answers={};
  for(const q of qs){
    const x=overlay.querySelector(`input[name="q-${CSS.escape(q["Question ID"])}"]:checked`);
    if(!x){toast("به همه سؤال‌ها جواب بده");return}
    answers[q["Question ID"]]=x.value
  }
  const btn=overlay.querySelector("#submitQuiz");btn.disabled=true;btn.textContent="در حال تصحیح…";
  try{
    const d=await api("/functions/v1/answerhub-data",{method:"POST",body:{action:"grade_quiz",scope,module_id:moduleId,answers}});
    const box=overlay.querySelector("#quizResult");
    const wrong=(d.detail||[]).filter(x=>!x.correct);
    box.className="quizResult "+(d.passed?"pass":"fail");
    box.innerHTML=`<b>نمره: ${d.score} از ۱۰۰ — ${d.passed?"قبول شدی ✓":"قبول نشدی"}</b>${wrong.length?`<div style="margin-top:8px">${wrong.map(x=>`<div style="margin:5px 0">پاسخ درست: <b>${esc(x.correct_option)}</b> · ${esc(x.explanation||"")}</div>`).join("")}</div>`:""}`;
    if(d.passed){
      if(scope==="module")S.training.add(moduleId);
      else{S.me.final_exam_passed=true;S.me.final_exam_score=d.score;S.me.final_exam_passed_at=new Date().toISOString()}
      logEvent("quiz_pass",{new_joiner_module:scope==="module"?moduleId:"FINAL",progress:progress(),score:d.score});
      setTimeout(()=>{overlay.remove();renderTraining();renderHome()},1100)
    }else{
      logEvent("quiz_fail",{new_joiner_module:scope==="module"?moduleId:"FINAL",score:d.score});
      btn.disabled=false;btn.textContent="دوباره امتحان بده"
    }
  }catch(e){
    toast("تصحیح آزمون انجام نشد");btn.disabled=false;btn.textContent="ثبت پاسخ و محاسبه نمره"
  }
}
function renderTraining(){
  if(!$("#page-training"))return;
  const modules=S.db.newJoiner||[],required=modules.filter(m=>String(m["اجباری"]||"").toUpperCase()!=="FALSE"),p=progress();
  const doneRequired=required.filter(m=>S.training.has(m["Module ID"])).length;
  const ready=required.length>0&&doneRequired===required.length;
  const finalPassed=!!S.me?.final_exam_passed;
  $("#page-training").innerHTML=`<div class="trainingHero"><div class="hero"><div class="heroEyebrow">NEW JOINER ACADEMY</div><h1>یاد بگیر، امتحان بده، بعد Pass شو</h1><p>هر ماژول فقط بعد از قبولی در آزمون خودش تکمیل می‌شود. پایان مسیر هم آزمون نهایی دارد.</p></div>
  <div class="progressCard"><div class="progressRing" style="--p:${p}%"><b>${p}%</b></div><div class="muted" style="font-size:9px;margin-top:8px">${doneRequired} از ${required.length} ماژول پاس شده</div></div></div>
  <div class="examCard"><div style="display:flex;justify-content:space-between;gap:14px;align-items:center"><div><h3>🎯 آزمون نهایی</h3><p>${finalPassed?`قبول شدی · نمره ${Math.round(Number(S.me.final_exam_score||0))}/100`:ready?"همه ماژول‌ها را پاس کردی؛ آزمون نهایی باز است.":"بعد از قبولی در همه ماژول‌های اجباری باز می‌شود."}</p></div>
  ${finalPassed?`<span class="quizBadge">FINAL PASS ✓</span>`:`<button class="btn primary" id="finalExamBtn" ${ready?"":"disabled"}>شروع آزمون نهایی</button>`}</div></div>
  <div class="modules">${modules.map((m,i)=>{const id=m["Module ID"],done=S.training.has(id),hasQuiz=quizFor("module",id).length>0;return `<div class="module ${done?"done":""}" data-id="${esc(id)}">
  <div class="moduleNum">${done?"✓":i+1}</div><div><h3>${esc(m["عنوان"])}</h3><p>${esc(m["هدف یادگیری"]||"")} · ${esc(m["مدت تقریبی"]||"")} دقیقه</p>
  <div class="moduleDetail"><p>${esc(m["محتوا / خلاصه"]||"")}</p><div class="exercise"><b>تمرین:</b><br>${esc(m["تمرین عملی"]||"")}</div>
  <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${m["لینک مقاله مرتبط"]?`<button class="btn small jumpArticle" data-article="${esc(m["لینک مقاله مرتبط"])}">مقاله مرتبط</button>`:""}${done?`<button class="btn small coachBtn" data-coach="${esc(id)}">نکته مربی</button>`:""}</div>
  ${done?`<div class="coach hidden" id="coach-${esc(id)}" style="margin-top:7px;font-size:9px;color:var(--success)">${esc(m["جواب مورد انتظار / نکته مربی"]||"")}</div>`:""}</div></div>
  <div style="display:flex;gap:6px;align-items:center"><button class="btn small openMod">درس</button>${done?`<span class="quizBadge">قبول شد ✓</span><button class="btn small quizMod">مرور آزمون</button>`:`<button class="btn small primary quizMod" ${hasQuiz?"":"disabled"}>${hasQuiz?"شروع آزمون":"آزمون در دسترس نیست"}</button>`}</div></div>`}).join("")}</div>`;
  $$(".openMod").forEach(b=>b.onclick=()=>b.closest(".module").classList.toggle("open"));
  $$(".coachBtn").forEach(b=>b.onclick=()=>$("#coach-"+b.dataset.coach)?.classList.toggle("hidden"));
  $$(".jumpArticle").forEach(b=>b.onclick=()=>openArticle(b.dataset.article));
  $$(".quizMod").forEach(b=>b.onclick=()=>openQuiz("module",b.closest(".module").dataset.id));
  $("#finalExamBtn")?.addEventListener("click",()=>openQuiz("final","FINAL"))
}

async function renderAdmin(){
  if(!$("#page-admin")||!S.access?.can_manage_users)return;
  $("#page-admin").innerHTML=`<div class="adminTop"><div><h2 style="margin:0;font-size:16px">مدیریت کاربران</h2><div class="muted" style="font-size:9px">تأیید، رد، تغییر نوع دسترسی و غیرفعال‌سازی</div></div><button class="btn small" id="refreshUsers">↻ بروزرسانی</button></div><div id="adminBody"><div class="empty">در حال دریافت کاربران…</div></div>`;
  $("#refreshUsers").onclick=renderAdmin;
  try{
    const users=await rpc("admin_list_users"),stats={pending:0,active:0,rejected:0,disabled:0};
    users.forEach(u=>stats[u.status]=(stats[u.status]||0)+1);
    const statusFa={pending:"در انتظار",active:"فعال",rejected:"رد شده",disabled:"غیرفعال"};
    $("#adminBody").innerHTML=`<div class="adminStats"><div class="adminStat"><b>${stats.pending}</b><span>در انتظار تأیید</span></div><div class="adminStat"><b>${stats.active}</b><span>فعال</span></div><div class="adminStat"><b>${stats.disabled}</b><span>غیرفعال</span></div><div class="adminStat"><b>${users.length}</b><span>کل کاربران</span></div></div>
    <div class="tableWrap"><table><thead><tr><th>کاربر</th><th>Email</th><th>درخواست</th><th>دسترسی</th><th>وضعیت</th><th>Onboarding</th><th>Final Exam</th><th>اقدام</th></tr></thead>
    <tbody>${users.map(u=>`<tr data-id="${u.id}"><td><b>${esc(u.full_name||u.username||"—")}</b></td><td>${esc(u.email||"")}</td><td>${esc(roleLabel(u.requested_role))}</td>
    <td>${u.role==="admin"?`<span class="pill">ادمین</span>`:`<select class="roleSelect">${S.roles.map(r=>`<option value="${esc(r["Role ID"])}" ${u.role===r["Role ID"]?"selected":""}>${esc(r["Role Label FA"])}</option>`).join("")}</select>`}</td>
    <td><span class="sbadge ${u.status==="active"?"activeStatus":u.status==="pending"?"pending":"disabledStatus"}">${esc(statusFa[u.status]||u.status)}</span></td><td>${Math.round(Number(u.onboarding_score||0))}%</td><td>${u.final_exam_passed?`<span class="quizBadge">${Math.round(Number(u.final_exam_score||0))}% ✓</span>`:`<span class="muted">—</span>`}</td>
    <td>${u.role==="admin"?`<span class="muted">مالک سیستم</span>`:`<div style="display:flex;gap:5px">${u.status!=="active"?`<button class="btn primary small approve">تأیید</button>`:`<button class="btn small disable">غیرفعال</button>`}<button class="btn danger small reject">رد</button></div>`}</td></tr>`).join("")}</tbody></table></div>`;
    $$("#adminBody tr[data-id]").forEach(tr=>{
      const id=tr.dataset.id,sel=tr.querySelector(".roleSelect");if(!sel)return;
      tr.querySelector(".approve")?.addEventListener("click",()=>adminSet(id,"active",sel.value));
      tr.querySelector(".disable")?.addEventListener("click",()=>adminSet(id,"disabled",sel.value));
      tr.querySelector(".reject")?.addEventListener("click",()=>adminSet(id,"rejected",sel.value));
      sel.onchange=()=>{if(tr.querySelector(".sbadge")?.textContent==="فعال")adminSet(id,"active",sel.value)}
    })
  }catch(e){$("#adminBody").innerHTML=`<div class="empty">خطا در دریافت کاربران: ${esc(e.message)}</div>`}
}
async function adminSet(id,status,role){
  try{await rpc("admin_set_user",{p_user_id:id,p_status:status,p_role:role});toast("دسترسی کاربر بروزرسانی شد ✓");renderAdmin()}
  catch(e){toast("خطا: "+(e.message||""))}
}

document.addEventListener("click",e=>{if(!e.target.closest(".searchWrap"))$("#searchPanel")?.classList.remove("open")});
document.addEventListener("keydown",e=>{
  if(S.me?.status==="active"&&S.access&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault();$("#command").classList.add("open");$("#cmdInput").focus()
  }
  if(e.key==="Escape")$("#command").classList.remove("open")
});
$("#command").onclick=e=>{if(e.target===$("#command"))$("#command").classList.remove("open")};
$("#cmdInput").oninput=e=>{
  if(S.me?.status!=="active")return;
  const q=e.target.value,res=search(q,15);
  $("#cmdResults").innerHTML=res.map(x=>`<div class="searchItem" data-id="${esc(x.a.ID)}"><div><b>${esc(x.a["عنوان مقاله"])}</b><span>${esc(x.a["دسته‌بندی"])}</span></div><div class="score">${Math.min(99,Math.round(x.s))}%</div></div>`).join("")||`<div class="empty">نتیجه‌ای پیدا نشد.</div>`;
  $("#cmdResults").querySelectorAll(".searchItem").forEach(i=>i.onclick=()=>{$("#command").classList.remove("open");openArticle(i.dataset.id)})
};

setInterval(()=>{if(S.me?.status==="active")syncContent(true).catch(()=>{})},90000);
setInterval(checkBuild,120000);
window.addEventListener("focus",()=>{if(S.me?.status==="active")syncContent(true).catch(()=>{});checkBuild()});
boot();

</script>
