function shell(){let admin=S.access?.can_manage_users;A.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="mark">S</div><div><b>Answer Hub</b><small>Merchant Knowledge</small></div></div><nav class="nav"><button class="on" data-v="home">⌂ <span>خانه</span></button><button data-v="kb">⌕ <span>پایگاه دانش</span></button>${S.access?.can_use_new_joiner?'<button data-v="train">🎓 <span>New Joiner</span></button>':""}${admin?'<button data-v="admin">▦ <span>مدیریت کاربران</span></button>':""}</nav><div class="profile"><div class="avatar">${e((S.me.full_name||"U")[0])}</div><div><b>${e(S.me.full_name||S.me.username||"کاربر")}</b><small>${e(S.me.role==="admin"?"ادمین":S.me.role)}</small></div><button class="btn" onclick="logout()">↪</button></div></aside><main class="main"><header class="top"><div class="search"><input id="q" placeholder="مثلاً: تسویه نیومده، Forbidden، تغییر شبا…"><div id="res" class="results"></div></div><div class="live"><span class="dot"></span> Live</div></header><div id="page" class="page"></div></main></div>`;document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>view(b.dataset.v));q.oninput=()=>searchUI(q.value);view("home");setInterval(refresh,90000)}
function view(v){S.view=v;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));if(v==="home")home();if(v==="kb")kb();if(v==="train")train();if(v==="admin")admin()}
function home(){let a=S.data.articles,c={};a.forEach(x=>c[x["دسته‌بندی"]]=(c[x["دسته‌بندی"]]||0)+1);page.innerHTML=`<div class="hero"><em>SNAPPPAY · KNOWLEDGE</em><h1>${e((S.me.full_name||"").split(" ")[0])}، دنبال چی می‌گردی؟</h1><p>${e(S.data.config.SEARCH_HELP||"موضوع را با زبان طبیعی بنویس؛ لازم نیست اسم دقیق دسته را بدانی.")}</p><input id="hq" placeholder="مثلاً: پرداخت گذشته ولی واریز نشده…"><div class="chips">${String(S.data.config.SEARCH_EXAMPLES||"تسویه نیومده|شبا عوض کنم|Forbidden|محصول تو سرچ نیست").split("|").map(x=>`<button class="chip">${e(x.trim())}</button>`).join("")}</div></div><div class="stats"><div class="stat"><b>${a.length}</b><span>مقاله فعال</span></div><div class="stat"><b>${Object.keys(c).length}</b><span>دسته‌بندی</span></div><div class="stat"><b>${S.data.newJoiner.length}</b><span>ماژول آموزشی</span></div><div class="stat"><b>Live</b><span>همگام با سرور</span></div></div><div class="section"><h3>دسته‌بندی‌ها</h3><div class="grid">${Object.entries(c).map(([x,n])=>`<div class="card" data-cat="${e(x)}"><span class="pill">${e(x)}</span><h4>${e(x)}</h4><p>${n} مقاله</p></div>`).join("")}</div></div>`;hq.onkeydown=x=>{if(x.key==="Enter"){q.value=hq.value;searchUI(hq.value);q.focus()}};document.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{q.value=x.textContent;searchUI(q.value);q.focus()});document.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>{S.cat=x.dataset.cat;view("kb")})}
function kb(){let a=S.cat?S.data.articles.filter(x=>x["دسته‌بندی"]===S.cat):S.data.articles;let cats=["همه",...new Set(S.data.articles.map(x=>x["دسته‌بندی"]))];page.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:end;margin-bottom:10px"><div><h2 style="font-size:18px">پایگاه دانش</h2><div class="muted" style="font-size:9px">${a.length} مقاله</div></div></div><div class="chips">${cats.map(c=>`<button class="chip" data-c="${e(c==="همه"?"":c)}">${e(c)}</button>`).join("")}</div><div class="grid" style="margin-top:12px">${a.map(card).join("")}</div>`;document.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{S.cat=x.dataset.c;kb()});wire()}
function card(a){return `<div class="card art" data-id="${e(a.ID)}"><span class="pill">${e(a["دسته‌بندی"])}</span><h4>${e(a["عنوان مقاله"])}</h4><p>${e(a["نمونه سؤال‌ها"]||"")}</p></div>`}
function wire(){document.querySelectorAll(".art").forEach(x=>x.onclick=()=>article(x.dataset.id))}
function searchUI(t){t=n(t);if(!t)return res.classList.remove("show");let r=S.data.articles.map(a=>{let s=n([a["عنوان مقاله"],a["کلمات کلیدی"],a["عبارت‌های مشابه / Semantic Aliases"],a["نمونه سؤال‌ها"],a["تگ‌ها"]].join(" ")),sc=t.split(" ").filter(Boolean).reduce((z,w)=>z+(s.includes(w)?1:0),0);return{a,sc}}).filter(x=>x.sc).sort((a,b)=>b.sc-a.sc).slice(0,12);res.innerHTML=r.length?r.map(x=>`<div class="result" data-id="${e(x.a.ID)}"><b>${e(x.a["عنوان مقاله"])}</b><span>${e(x.a["دسته‌بندی"])} · ${e(x.a["نمونه سؤال‌ها"]||"")}</span></div>`).join(""):'<div class="empty">نتیجه‌ای پیدا نشد.</div>';res.classList.add("show");res.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{res.classList.remove("show");article(x.dataset.id)})}
function prepared(a){let z=String(a["پاسخ آماده برای پذیرنده"]||""),u=String(a["لینک اقدام مستقیم"]||"");if(u&&!z.includes(u))z+=`\n\n${a["برچسب اقدام"]||"لینک اقدام"}:\n${u}`;return z}
function links(t){return e(t).replace(/(https?:\/\/[^\s<]+)/g,'<a class="link" target="_blank" rel="noopener" href="$1">$1</a>').replace(/\n/g,"<br>")}
function article(id){let a=S.data.articles.find(x=>x.ID===id);if(!a)return;let z=prepared(a),action=a["لینک اقدام مستقیم"]||"",src=a["لینک آکادمی"]||"";S.view="article";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));page.innerHTML=`<div class="article"><main class="articleMain"><div class="box"><button class="btn" onclick="view('kb')">← برگشت</button><div style="margin-top:12px"><span class="pill">${e(a["دسته‌بندی"])}</span> <span class="tag">${e(a.ID)}</span></div><h1 class="title">${e(a["عنوان مقاله"])}</h1><div class="muted" style="font-size:10px">${e(a["نمونه سؤال‌ها"]||"")}</div></div><div class="answerBox"><div class="answerHead"><div><small class="muted">پاسخ نهایی</small><br><b style="font-size:11px">آماده ارسال برای پذیرنده</b></div><button class="btn primary" id="copy">کپی پاسخ</button></div><div class="answer">${links(z)}</div></div>${S.access?.can_view_internal_notes&&a["راهنمای داخلی کارشناس"]?`<div class="box" style="margin-top:10px;background:#fff9ea;color:#8a6200;font-size:10px"><b>نکته داخلی کارشناس</b><br>${e(a["راهنمای داخلی کارشناس"])}</div>`:""}</main><aside class="aside">${action?`<div class="box"><small class="muted">اقدام مستقیم</small><h4>${e(a["برچسب اقدام"]||"باز کردن لینک")}</h4><a class="action" target="_blank" href="${e(action)}">باز کردن لینک ↗</a><span class="url">${e(action)}</span></div>`:""}${src?`<div class="box"><small class="muted">منبع رسمی</small><a target="_blank" class="link" href="${e(src)}">${e(a["عنوان منبع آکادمی"]||"راهنمای آکادمی")} ↗</a></div>`:""}</aside></div>`;copy.onclick=async()=>{try{await navigator.clipboard.writeText(z);copy.textContent="کپی شد ✓";setTimeout(()=>copy.textContent="کپی پاسخ",1200)}catch{}}}
function train(){page.innerHTML=`<h2 style="font-size:18px">New Joiner</h2><div class="sub">مسیر یادگیری مرحله‌به‌مرحله</div>${S.data.newJoiner.map((m,i)=>`<div class="module"><span class="pill">${i+1}</span><h4>${e(m["عنوان"])}</h4><p>${e(m["هدف یادگیری"]||"")}</p><div style="font-size:10px">${e(m["محتوا / خلاصه"]||"")}</div></div>`).join("")||'<div class="empty">ماژولی تعریف نشده.</div>'}
async function admin(){if(!S.access?.can_manage_users)return;page.innerHTML='<h2 style="font-size:18px">مدیریت کاربران</h2><div class="empty">در حال دریافت…</div>';try{let u=await rpc("admin_list_users"),st={pending:0,active:0,disabled:0,rejected:0};u.forEach(x=>st[x.status]=(st[x.status]||0)+1);page.innerHTML=`<h2 style="font-size:18px">مدیریت کاربران</h2><div class="adminStats"><div class="stat"><b>${st.pending}</b><span>در انتظار</span></div><div class="stat"><b>${st.active}</b><span>فعال</span></div><div class="stat"><b>${st.disabled}</b><span>غیرفعال</span></div><div class="stat"><b>${u.length}</b><span>کل کاربران</span></div></div><div class="table"><table><thead><tr><th>کاربر</th><th>ایمیل</th><th>درخواست</th><th>وضعیت</th><th>دسترسی</th><th>اقدام</th></tr></thead><tbody>${u.map(x=>`<tr data-id="${x.id}"><td>${e(x.full_name||x.username||"—")}</td><td>${e(x.email||"")}</td><td>${e(x.requested_role||"")}</td><td><span class="badge ${x.status==="active"?"active":""}">${e(x.status)}</span></td><td>${x.role==="admin"?"ادمین":`<select class="roleSel"><option value="employee" ${x.role==="employee"?"selected":""}>نیروی شرکت</option><option value="new_joiner" ${x.role==="new_joiner"?"selected":""}>نیو جوینر</option></select>`}</td><td>${x.role==="admin"?"مالک سیستم":`<button class="btn primary approve">تأیید</button> <button class="btn danger reject">رد</button>`}</td></tr>`).join("")}</tbody></table></div>`;document.querySelectorAll("tr[data-id]").forEach(tr=>{let id=tr.dataset.id,sel=tr.querySelector(".roleSel");if(!sel)return;tr.querySelector(".approve").onclick=()=>setUser(id,"active",sel.value);tr.querySelector(".reject").onclick=()=>setUser(id,"rejected",sel.value)})}catch(x){page.innerHTML='<div class="empty">خطا در دریافت کاربران</div>'}}
async function setUser(id,status,role){try{await rpc("admin_set_user",{p_user_id:id,p_status:status,p_role:role});admin()}catch(x){alert(x.message)}}
async function refresh(){if(S.me?.status!=="active")return;try{let d=await api("/functions/v1/answerhub-data");S.data={articles:d.articles||[],media:d.media||[],newJoiner:d.newJoiner||[],config:d.config||{}};if(S.view==="home")home();if(S.view==="kb")kb()}catch{}}
async function logout(){try{await api("/auth/v1/logout",{method:"POST"})}catch{}save(null);S.me=null;S.access=null;auth()}
async function boot(){await loadPublic();try{let r=localStorage.getItem("ah-session");if(r)S.session=JSON.parse(r)}catch{}S.session?.access_token?bootAuthed():auth()}
boot();
</script></body></html>
