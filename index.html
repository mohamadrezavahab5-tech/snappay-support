<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>SnappPay Answer Hub</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f8fa;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#151822}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:#fff;border:1px solid #e8ebf0;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(20,26,40,.08);text-align:center}
.logo{width:48px;height:48px;border-radius:14px;background:#151822;color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-weight:900}
h1{font-size:18px;margin:0 0 6px}p{font-size:11px;color:#6f7785;margin:0}.spin{width:22px;height:22px;border:2px solid #e2e6ec;border-top-color:#4b67f2;border-radius:50%;animation:s .7s linear infinite;margin:20px auto 0}@keyframes s{to{transform:rotate(360deg)}}.err{color:#c83f59;margin-top:14px;font-size:10px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="logo">S</div><h1>SnappPay Answer Hub</h1><p>در حال دریافت آخرین نسخه…</p><div class="spin"></div><div class="err" id="err"></div></div></div>
<script>
const BASE="https://xcmgbgthhpstxmmmhvqy.supabase.co";
const KEY="sb_publishable_9PyN5TZ2lTm1KKPN_MwAog_MjOeHv9U";
const H={apikey:KEY};
async function j(path){
  const r=await fetch(BASE+path,{headers:H,cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function boot(){
  try{
    const m=await j("/rest/v1/app_release_manifest?id=eq.1&select=current_build");
    const build=m?.[0]?.current_build;
    if(!build) throw new Error("release manifest");
    const rows=await j("/rest/v1/app_release_chunks?build=eq."+encodeURIComponent(build)+"&select=chunk_no,payload&order=chunk_no.asc");
    if(!rows.length) throw new Error("release chunks");
    const b64=rows.map(x=>x.payload).join("");
    const bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("err").textContent="خطا در دریافت نسخه. صفحه را Refresh کنید.";
    console.error(e);
  }
}
boot();
</script>
</body>
</html>
